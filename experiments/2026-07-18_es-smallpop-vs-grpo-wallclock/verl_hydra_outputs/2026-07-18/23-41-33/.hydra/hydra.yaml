    - trainer.nnodes=1
    - trainer.save_freq=-1
    - trainer.test_freq=-1
    - trainer.val_before_train=False
    - trainer.total_epochs=1000
    - trainer.total_training_steps=30
    - trainer.project_name=es_grpo
    - trainer.experiment_name=phase2_grpo
    - trainer.default_local_dir=/home/hyin66/es-fine-tuning-paper/es_bench/grpo/out_phase2_grpo
  job:
    name: main_ppo
